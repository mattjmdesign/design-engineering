<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Specs With States</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #ffffff; color: #1b1f24; font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 640px; margin: 0 auto; padding: 24px; }
  h1 { font-size: 28px; line-height: 1.25; margin: 0 0 16px; }
  .spinner, .empty, .error, .offline, .saved { padding: 16px; border: 1px solid #d0d5dd; border-radius: 8px; margin-bottom: 16px; }
  .error { color: #8a1c1c; border-color: #8a1c1c; }
  ul { list-style: none; margin: 0 0 16px; padding: 0; }
  .row { padding: 8px 0; border-bottom: 1px solid #d0d5dd; }
  .toolbar { display: flex; gap: 8px; }
  button { height: 44px; padding: 0 16px; border: 1px solid #6b7280; border-radius: 8px; background: #ffffff; color: #1b1f24; font: inherit; cursor: pointer; }
  button:hover { background: #e5ecff; }
  button:focus-visible { outline: 2px solid #0b5fff; outline-offset: 2px; }
  .panel { padding: 16px; margin-top: 16px; border: 1px solid #d0d5dd; border-radius: 8px; }
</style>
</head>
<body>
<main>
  <h1>Specs</h1>
  <div id="out"><div class="spinner" role="status">Loading specs</div></div>
  <div class="toolbar">
    <button id="toggle" type="button" aria-expanded="false">Details</button>
    <button id="save" type="button">Save</button>
  </div>
  <div id="extra"></div>
  <div style="margin-top: 16px">
    <label for="nm" style="display: block; font-size: 14px; font-weight: 600; margin-bottom: 8px">Name</label>
    <input id="nm" type="text" autocomplete="off" style="height: 44px; width: 100%; padding: 0 12px; border: 1px solid #6b7280; border-radius: 8px; font: inherit; color: #1b1f24; background: #ffffff">
    <p id="nm-err" role="alert" style="margin: 8px 0 0; color: #8a1c1c"></p>
  </div>
</main>
<script>
  var out = document.getElementById('out');
  function show(html) { out.innerHTML = html; }
  function offlineBanner() { show('<div class="offline" role="alert">You are offline. Changes will sync later.</div>'); }
  window.addEventListener('offline', offlineBanner);
  fetch('http://127.0.0.1:8765/api/specs')
    .then(function (r) { if (!r.ok) { throw new Error('HTTP ' + r.status); } return r.json(); })
    .then(function (rows) {
      if (!rows.length) { show('<div class="empty">No specs yet. Create the first one.</div>'); return; }
      show('<ul>' + rows.map(function (x) { return '<li class="row">' + String(x.name).replace(/</g, '&lt;') + '</li>'; }).join('') + '</ul>');
    })
    .catch(function (e) {
      if (!navigator.onLine) { offlineBanner(); return; }
      console.error('Could not load specs', String(e));
      show('<div class="error" role="alert">Could not load specs. Try again.</div>');
    });
  document.getElementById('nm').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { document.getElementById('nm-err').textContent = this.value.length < 3 ? 'Name is too short' : ''; }
  });
  document.getElementById('toggle').addEventListener('click', function () {
    document.getElementById('extra').innerHTML = '<div class="panel">Panel is open.</div>';
    this.setAttribute('aria-expanded', 'true');
  });
  document.getElementById('save').addEventListener('click', function () {
    fetch('http://127.0.0.1:8765/api/save', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{"name":"x"}' })
      .then(function (r) { return r.json(); })
      .then(function () { document.getElementById('extra').innerHTML = '<div class="saved" role="status">Saved</div>'; })
      .catch(function () { document.getElementById('extra').innerHTML = '<div class="error" role="alert">Save failed</div>'; });
  });
</script>
</body>
</html>

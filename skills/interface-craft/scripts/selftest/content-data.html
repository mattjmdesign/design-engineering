<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Content Column With A Table</title>
<!-- A table-dominant page with no width cap. Capture at 1920: the column is over 1440 px, which is information (cap), not a warning (cap_text),
     because data tables are exempt from the form and prose limit. -->
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #ffffff; color: #1b1f24; font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  .shell { display: flex; min-height: 100vh; }
  .rail { width: 64px; flex: none; background: #f1f5f9; padding: 16px 0; text-align: center; }
  .rail a { color: #0b5fff; }
  .region { flex: 1; min-width: 0; height: 100vh; overflow-y: auto; }
  main { padding: 16px 24px; }
  h1 { font-size: 28px; line-height: 1.25; margin: 0 0 16px; }
  table { width: 100%; border-collapse: collapse; }
  th, td { padding: 12px 16px; border-bottom: 1px solid #d0d5dd; text-align: left; }
  th { font-size: 14px; font-weight: 600; color: #4b5563; }
</style>
</head>
<body>
<div class="shell">
  <nav class="rail" aria-label="Primary"><a href="#home">Home</a></nav>
  <div class="region">
    <main>
      <h1>Specs</h1>
      <table>
        <thead><tr><th scope="col">Title</th><th scope="col">Owner</th><th scope="col">Status</th><th scope="col">Updated</th><th scope="col">Reviews</th></tr></thead>
        <tbody>
          <tr><td>Login flow</td><td>Sam Lee</td><td>Open</td><td>2 days ago</td><td>3</td></tr>
          <tr><td>Projects hub</td><td>Ana Ruiz</td><td>In review</td><td>3 days ago</td><td>5</td></tr>
          <tr><td>Specs table</td><td>Kim Park</td><td>Open</td><td>3 days ago</td><td>1</td></tr>
          <tr><td>Inbox triage</td><td>Omar Aziz</td><td>Draft</td><td>4 days ago</td><td>0</td></tr>
          <tr><td>Git sync</td><td>Sam Lee</td><td>Open</td><td>5 days ago</td><td>2</td></tr>
          <tr><td>Usage report</td><td>Ana Ruiz</td><td>Done</td><td>6 days ago</td><td>4</td></tr>
        </tbody>
      </table>
    </main>
  </div>
</div>
</body>
</html>
